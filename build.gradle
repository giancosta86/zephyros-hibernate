buildscript {
    repositories {
        //TODO! Del this!
        mavenLocal()

        mavenCentral()
    }

    dependencies {
        classpath 'info.gianlucacosta.aurora:aurora:10.0.0-SNAPSHOT'
    }
}

apply plugin: 'java'
apply plugin: 'maven'

apply plugin: 'info.gianlucacosta.aurora'

group 'info.gianlucacosta.zephyros'
archivesBaseName = 'zephyros-hibernate'
version '2.0.0-SNAPSHOT'

description = 'Java utilities for Hibernate'

sourceCompatibility = 1.8

dependencies {
    compile 'org.hibernate:hibernate-entitymanager:5.2.12.Final'

    compile 'info.gianlucacosta.zephyros:zephyros-core:2.0.0-SNAPSHOT'
}

aurora {
    gitHubUser = 'giancosta86'

    author {
        name = 'Gianluca Costa'
        email = 'gianluca@gianlucacosta.info'
        url = 'http://gianlucacosta.info/'
    }
}